<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Insighta Labs+</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="navigation-sec">
        <a href="dashboard.html" class="logo-2">Insighta Labs+</a>
        <div class="nav-right">
            <nav class="navigation">
                <ul class="nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="profiles.html">Profiles</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
            <button type="button" onclick="logout()" class="logout">Logout</button>
        </div>
    </div>

    <div class="page">
        <h2>Account</h2>
        <div id="account-info">
            <div class="loading">Loading account info...</div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        requireLogin();

        async function loadAccount() {
            const res = await apiCall("/auth/me");
            if (!res) return;

            const data = await res.json();
            const u = data.data;

            document.getElementById("account-info").innerHTML = `
                <div class="account-card">
                    ${u.avatar_url ? `<img src="${u.avatar_url}" alt="Avatar">` : ''}
                    <div>
                        <h3>@${u.username}</h3>
                        <p>Email: ${u.email || 'Not provided'}</p>
                        <p>Role: ${u.role}</p>
                    </div>
                </div>
            `;
        }

        loadAccount();
    </script>
</body>

</html>
