<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Insighta Labs+</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="navigation-sec">
        <a href="dashboard.html" class="logo-2">Insighta Labs+</a>
        <button type="button" class="hamburger" aria-label="Toggle navigation" onclick="this.classList.toggle('open'); document.querySelector('.nav-right').classList.toggle('open')">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-right">
            <nav class="navigation">
                <ul class="nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="profiles.html">Profiles</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
            <button type="button" onclick="logout()" class="logout">Logout</button>
        </div>
    </div>

    <div class="page">
        <div id="account-info">
            <div class="loading">Loading account info...</div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        requireLogin();

        async function loadAccount() {
            const res = await apiCall("/auth/me");
            if (!res) return;

            const data = await res.json();
            const u = data.data;
            const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

            document.getElementById("account-info").innerHTML = `
                <div class="account-profile">
                    <div class="account-header">
                        ${u.avatar_url
                            ? `<img src="${u.avatar_url}" alt="${u.username}'s avatar" class="account-avatar">`
                            : `<div class="account-avatar-placeholder">${u.username.charAt(0).toUpperCase()}</div>`
                        }
                        <div class="account-header-info">
                            <h2 class="account-username">@${u.username}</h2>
                            <span class="account-role-badge">${cap(u.role)}</span>
                        </div>
                    </div>

                    <div class="account-fields">
                        <div class="account-field">
                            <span class="account-field-label">Email</span>
                            <span class="account-field-value">${u.email || 'Not provided'}</span>
                        </div>
                        <div class="account-field">
                            <span class="account-field-label">Role</span>
                            <span class="account-field-value">${cap(u.role)}</span>
                        </div>
                        <div class="account-field">
                            <span class="account-field-label">Connected via</span>
                            <span class="account-field-value">GitHub</span>
                        </div>
                    </div>

                    <div class="account-actions">
                        <button type="button" class="account-logout-btn" onclick="logout()">Logout</button>
                    </div>
                </div>
            `;
        }

        loadAccount();
    </script>
</body>

</html>
