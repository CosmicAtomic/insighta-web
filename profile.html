<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Detail | Insighta Labs+</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="navigation-sec">
        <a href="dashboard.html" class="logo-2">Insighta Labs+</a>
        <button type="button" class="hamburger" aria-label="Toggle navigation" onclick="this.classList.toggle('open'); document.querySelector('.nav-right').classList.toggle('open')">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-right">
            <nav class="navigation">
                <ul class="nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="profiles.html">Profiles</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
            <button type="button" onclick="logout()" class="logout">Logout</button>
        </div>
    </div>

    <div class="page">
        <h2>Profile Detail</h2>
        <div id="profile-detail">
            <div class="loading">Loading profile...</div>
        </div>
        <a href="profiles.html" class="back-link">← Back to Profiles</a>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        requireLogin();

        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                document.getElementById("profile-detail").innerHTML = "<p>No profile ID provided.</p>";
                return;
            }

            const res = await apiCall("/api/profiles/" + id);
            if (!res) return;

            if (res.status === 404) {
                document.getElementById("profile-detail").innerHTML = "<p>Profile not found.</p>";
                return;
            }

            const data = await res.json();
            const p = data.data;

            const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
            const formatDate = s => s ? new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';

            document.title = `${p.name} | Insighta Labs+`;

            document.getElementById("profile-detail").innerHTML = `
                <div class="profile-detail">
                    <div class="field"><span class="field-label">Name</span><span class="field-value">${p.name}</span></div>
                    <div class="field"><span class="field-label">Gender</span><span class="field-value">${capitalize(p.gender)} (${(p.gender_probability * 100).toFixed(0)}% confidence)</span></div>
                    <div class="field"><span class="field-label">Age</span><span class="field-value">${p.age}</span></div>
                    <div class="field"><span class="field-label">Age Group</span><span class="field-value">${capitalize(p.age_group)}</span></div>
                    <div class="field"><span class="field-label">Country</span><span class="field-value">${p.country_name || p.country_id} (${(p.country_probability * 100).toFixed(0)}% confidence)</span></div>
                    <div class="field"><span class="field-label">Created</span><span class="field-value">${formatDate(p.created_at)}</span></div>
                </div>
            `;
        }

        loadProfile();
    </script>
</body>

</html>
